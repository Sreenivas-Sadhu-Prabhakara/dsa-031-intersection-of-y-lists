<text x="56.0" y="420.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">Equal total distance means they arrive at the junction TOGETHER on the second leg —</text>
<text x="56.0" y="439.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">node 8. No intersection? They hit nil together instead, and nil == nil ends the</text>
<text x="56.0" y="458.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">loop.</text>

<text x="56.0" y="316.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">Walk two pointers; when one falls off its list's end, restart it at the OTHER list's</text>
<text x="56.0" y="335.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">head. Both then travel exactly lenA + lenB steps.</text>
<text x="72.0" y="370.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">walks</text>

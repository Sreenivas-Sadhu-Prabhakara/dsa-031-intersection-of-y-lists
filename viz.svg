<text x="485.5" y="370.0" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#1e293b" text-anchor="middle">path B → 99, 1, 8, 10, 3, 8</text>
<line x1="24.0" y1="395.0" x2="736.0" y2="395.0" stroke="#e2e8f0" stroke-width="1"/>
